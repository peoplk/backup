<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1C1F2E"/>
      <stop offset="1" stop-color="#0D0F1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B83EB"/>
      <stop offset="1" stop-color="#5E6AD2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8B96E8"/>
      <stop offset="0.5" stop-color="#5E6AD2"/>
      <stop offset="1" stop-color="#4A52B8"/>
    </linearGradient>
    <clipPath id="bgClip">
      <rect x="16" y="16" width="224" height="224" rx="48"/>
    </clipPath>
  </defs>
  
  <!-- 背景 -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="223" height="223" rx="47.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
  
  <g clip-path="url(#bgClip)">
    <!-- 外圈 -->
    <circle cx="128" cy="128" r="72" fill="none" stroke="#1F2235" stroke-width="8"/>
    
    <!-- 进度弧 - 75%完成 -->
    <path d="M 128 56 A 72 72 0 1 1 56 128" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    
    <!-- 中心圆 -->
    <circle cx="128" cy="128" r="28" fill="url(#accent)"/>
    
    <!-- 时针 - 指向10点位置 -->
    <line x1="128" y1="128" x2="128" y2="108" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" transform="rotate(-60 128 128)"/>
    
    <!-- 分针 - 指向12点位置 -->
    <line x1="128" y1="128" x2="128" y2="100" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 中心点 -->
    <circle cx="128" cy="128" r="4" fill="#FFFFFF"/>
    
    <!-- 顶部标记 -->
    <circle cx="128" cy="56" r="4" fill="#5E6AD2" opacity="0.8"/>
    <circle cx="200" cy="128" r="3" fill="#5E6AD2" opacity="0.5"/>
    <circle cx="128" cy="200" r="3" fill="#5E6AD2" opacity="0.5"/>
    <circle cx="56" cy="128" r="3" fill="#5E6AD2" opacity="0.5"/>
  </g>
</svg>
